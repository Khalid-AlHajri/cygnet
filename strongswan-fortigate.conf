# FortiGate settings for the patched strongSwan in /opt/cygnet.
charon {
    # How the final AUTH, sent after the code, is keyed. Other values: msk, psk.
    fortigate_auth_key = skp

    plugins {
        eap-gtc {
            otp_helper = /opt/cygnet/libexec/otp-helper
            # The password was already sent via MS-CHAPv2, so EAP-GTC only ever
            # carries the code. This keeps the password from being sent in the clear.
            otp_mode = always
        }
        resolve {
            resolvconf {
                path = /opt/cygnet/libexec/dns-hook
            }
        }
    }

    # These make this client identify itself to the gateway as FortiClient. They are
    # off because they may not be needed, and your organisation may not allow them.
    # fortigate_suppress_eap_only = yes
    # fortigate_send_forticlient_vid = yes
    # fortigate_fct_file = /opt/cygnet/etc/fct_data.txt
}
